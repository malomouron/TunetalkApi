services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Data Source=/data/tunetalk.db"
      Jwt__Issuer: "Tunetalk"
      Jwt__Audience: "Tunetalk.Mobile"
      Jwt__SigningKey: "${TUNETALK_JWT_SIGNING_KEY:?Set TUNETALK_JWT_SIGNING_KEY before starting}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - tunetalk-data:/data
    restart: unless-stopped

volumes:
  tunetalk-data:
